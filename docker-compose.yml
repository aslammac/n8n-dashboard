version: '3.8'

services:
  # Backend (NestJS)
  backend:
    build:
      context: ./n8n-marketplace-backend
      dockerfile: Dockerfile
    container_name: n8n-marketplace-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Note: Ensure you have MongoDB running on the host machine since we use host.docker.internal
      - DATABASE_URI=mongodb://host.docker.internal:27017/n8n-marketplace
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRONTEND_URL=https://flowstore.dev
    env_file:
      - ./n8n-marketplace-backend/.env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - app-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis-standalone
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis_data: